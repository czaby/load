# Test LOAD DATA statements against MySQL (service) and Aurora (manual).
# Uses LOAD DATA LOCAL INFILE for the MySQL stage — no volume mounts,
# no secure_file_priv configuration, no special Runner privileges.
# The only line that differs between stages is the source clause:
#   MySQL:  LOAD DATA LOCAL INFILE '...'
#   Aurora: LOAD DATA FROM S3 's3-...://...'

variables:
  CSV_PATH: "$CI_PROJECT_DIR/sql/sample_customers.csv"
  S3_URI: "s3-us-east-1://my-bucket/imports/customers.csv"

stages:
  - test-mysql
  - test-aurora

# ---------------------------------------------------------------------------
# Stage 1: automatic — MySQL 8.0 service container, LOCAL INFILE
# ---------------------------------------------------------------------------
test-mysql:
  stage: test-mysql
  image:
    name: mysql:8.0
    entrypoint: [""]
  services:
    - name: mysql:8.0
      alias: mysql
      variables:
        MYSQL_ROOT_PASSWORD: rootpass
        MYSQL_DATABASE: testdb
        MYSQL_USER: testuser
        MYSQL_PASSWORD: testpass
      # Enable LOCAL INFILE on the server; no secure_file_priv needed
      command: ["--local-infile=1", "--secure-file-priv=NULL"]
  before_script:
    - |
      for i in $(seq 1 30); do
        mysqladmin ping -h mysql -uroot -prootpass --silent && break
        sleep 2
      done
    - mysql -h mysql -uroot -prootpass testdb < sql/create_table.sql
  script:
    # Client must also allow LOCAL INFILE (disabled by default)
    - |
      sed "s|/CI_PROJECT_DIR/sql/sample_customers.csv|$CSV_PATH|" \
        sql/load_mysql.sql > /tmp/load_local.sql
    - mysql -h mysql -uroot -prootpass --local-infile=1 testdb < /tmp/load_local.sql
    - |
      COUNT=$(mysql -h mysql -uroot -prootpass testdb -N -e "SELECT COUNT(*) FROM customers;")
      echo "Row count: $COUNT"
      test "$COUNT" = "2"

# ---------------------------------------------------------------------------
# Stage 2: manual — real Aurora cluster
# ---------------------------------------------------------------------------
test-aurora:
  stage: test-aurora
  image:
    name: mysql:8.0
    entrypoint: [""]
  rules:
    - when: manual
  variables:
    AURORA_HOST: $AURORA_HOST
    AURORA_PORT: "3306"
    AURORA_USER: $AURORA_USER
    AURORA_PASSWORD: $AURORA_PASSWORD
    AURORA_DATABASE: $AURORA_DATABASE
  before_script:
    - |
      for i in $(seq 1 30); do
        mysqladmin ping -h "$AURORA_HOST" -P "$AURORA_PORT" -u"$AURORA_USER" -p"$AURORA_PASSWORD" --silent && break
        sleep 2
      done
    # Rewrite the LOCAL INFILE source clause into LOAD DATA FROM S3 — the only line that changes
    - |
      sed "s|LOAD DATA LOCAL INFILE '$CSV_PATH'|LOAD DATA FROM S3 '$S3_URI'|" \
        sql/load_mysql.sql > /tmp/load_aurora.sql
  script:
    - mysql -h "$AURORA_HOST" -P "$AURORA_PORT" -u"$AURORA_USER" -p"$AURORA_PASSWORD" "$AURORA_DATABASE" < sql/create_table.sql
    - mysql -h "$AURORA_HOST" -P "$AURORA_PORT" -u"$AURORA_USER" -p"$AURORA_PASSWORD" --local-infile=1 "$AURORA_DATABASE" < /tmp/load_aurora.sql
    - |
      COUNT=$(mysql -h "$AURORA_HOST" -P "$AURORA_PORT" -u"$AURORA_USER" -p"$AURORA_PASSWORD" "$AURORA_DATABASE" -N -e "SELECT COUNT(*) FROM customers;")
      echo "Row count: $COUNT"
      test "$COUNT" = "2"
