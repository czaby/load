# Test the canonical LOAD DATA FROM S3 statement.
# Default file (sql/load_data.sql) contains the production S3 statement.
# Stage 1 rewrites the S3 clause to LOAD DATA LOCAL INFILE for a MySQL
# service container. Stage 2 (manual) runs the untouched S3 statement
# against a real Aurora cluster.
# The only line that differs between stages is the source clause:
#   MySQL:  LOAD DATA LOCAL INFILE '...'
#   Aurora: LOAD DATA FROM S3 's3-...://...'

variables:
  CSV_PATH: "$CI_PROJECT_DIR/sql/sample_customers.csv"
  S3_URI: "s3-us-east-1://my-bucket/imports/customers.csv"
  LOAD_FILE: "sql/load_data.sql"

stages:
  - test-mysql
  - test-aurora

# ---------------------------------------------------------------------------
# Stage 1: automatic — MySQL 8.0 service container, LOCAL INFILE
# Rewrites the default S3 statement into LOCAL INFILE for testing.
# ---------------------------------------------------------------------------
test-mysql:
  stage: test-mysql
  image:
    name: mysql:8.0
    entrypoint: [""]
  services:
    - name: mysql:8.0
      alias: mysql
      variables:
        MYSQL_ROOT_PASSWORD: rootpass
        MYSQL_DATABASE: testdb
        MYSQL_USER: testuser
        MYSQL_PASSWORD: testpass
      # Enable LOCAL INFILE on the server; no secure_file_priv needed
      command: ["--local-infile=1", "--secure-file-priv=NULL"]
  before_script:
    - |
      for i in $(seq 1 30); do
        mysqladmin ping -h mysql -uroot -prootpass --silent && break
        sleep 2
      done
    - mysql -h mysql -uroot -prootpass testdb < sql/create_table.sql
  script:
    # Rewrite S3 → LOCAL INFILE: the only line that changes
    - |
      sed "s|LOAD DATA FROM S3 '$S3_URI'|LOAD DATA LOCAL INFILE '$CSV_PATH'|" \
        "$LOAD_FILE" > /tmp/load_local.sql
    - mysql -h mysql -uroot -prootpass --local-infile=1 testdb < /tmp/load_local.sql
    - |
      COUNT=$(mysql -h mysql -uroot -prootpass testdb -N -e "SELECT COUNT(*) FROM customers;")
      echo "Row count: $COUNT"
      test "$COUNT" = "2"

# ---------------------------------------------------------------------------
# Stage 2: manual — real Aurora cluster, untouched S3 statement
# ---------------------------------------------------------------------------
test-aurora:
  stage: test-aurora
  image:
    name: mysql:8.0
    entrypoint: [""]
  rules:
    - when: manual
  variables:
    AURORA_HOST: $AURORA_HOST
    AURORA_PORT: "3306"
    AURORA_USER: $AURORA_USER
    AURORA_PASSWORD: $AURORA_PASSWORD
    AURORA_DATABASE: $AURORA_DATABASE
  before_script:
    - |
      for i in $(seq 1 30); do
        mysqladmin ping -h "$AURORA_HOST" -P "$AURORA_PORT" -u"$AURORA_USER" -p"$AURORA_PASSWORD" --silent && break
        sleep 2
      done
  script:
    # No rewrite — run the canonical S3 statement as-is
    - mysql -h "$AURORA_HOST" -P "$AURORA_PORT" -u"$AURORA_USER" -p"$AURORA_PASSWORD" "$AURORA_DATABASE" < sql/create_table.sql
    - mysql -h "$AURORA_HOST" -P "$AURORA_PORT" -u"$AURORA_USER" -p"$AURORA_PASSWORD" "$AURORA_DATABASE" < "$LOAD_FILE"
    - |
      COUNT=$(mysql -h "$AURORA_HOST" -P "$AURORA_PORT" -u"$AURORA_USER" -p"$AURORA_PASSWORD" "$AURORA_DATABASE" -N -e "SELECT COUNT(*) FROM customers;")
      echo "Row count: $COUNT"
      test "$COUNT" = "2"
